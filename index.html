<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102b4e">
  <meta name="apple-mobile-web-app-title" content="PERSADA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="PERSADA — Pengelolaan Persediaan Terpadu. Persediaan Terkelola, Layanan Terjaga.">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icon-180.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/icon-512.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>PERSADA | Pengelolaan Persediaan Terpadu</title>
  <style>
    :root { color-scheme: dark; --navy:#102b4e; --navy2:#173c64; --gold:#c9953d; --gold2:#e6c27b; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body {
      min-height:100vh; min-height:100svh; display:grid; place-items:center;
      padding:28px; color:#fff; text-align:center; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:radial-gradient(ellipse at 50% 35%, #23496e 0%, var(--navy2) 38%, #091c34 100%);
    }
    main { width:min(100%,420px); }
    .logo { width:156px; height:156px; object-fit:cover; border-radius:30px; box-shadow:0 18px 50px #0006; }
    h1 { margin:25px 0 8px; font-size:29px; letter-spacing:.18em; font-weight:750; }
    .tagline { margin:0; color:#e6c27b; font-size:14px; letter-spacing:.04em; }
    .rule { width:54px; height:2px; margin:25px auto; background:linear-gradient(90deg,transparent,var(--gold2),transparent); }
    .status { color:#d8e2ee; font-size:14px; min-height:22px; }
    .spinner { width:25px; height:25px; margin:18px auto 12px; border:2px solid #ffffff40; border-top-color:var(--gold2); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    a { display:inline-block; margin-top:18px; padding:13px 24px; border-radius:999px; color:#142c49; background:linear-gradient(135deg,var(--gold2),var(--gold)); text-decoration:none; font-weight:700; }
    .small { margin-top:24px; color:#aebed0; font-size:11px; }
    @media (prefers-reduced-motion:reduce) { .spinner { animation:none; } }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./assets/icon-180.png" alt="Ikon PERSADA">
    <h1>PERSADA</h1>
    <p class="tagline">Persediaan Terkelola, Layanan Terjaga.</p>
    <div class="rule"></div>
    <div class="spinner" aria-hidden="true"></div>
    <p class="status" id="status">Menyiapkan aplikasi PERSADA…</p>
    <a id="openApp" href="https://script.google.com/macros/s/AKfycbwgDNaAGWFc6h04VNf6f5Uk5-I3UONGkcInSgKM30dNL-Xmc3tjnpYzAJbTfZz7svbamg/exec">Buka PERSADA</a>
    <p class="small">Pengelolaan Persediaan Terpadu</p>
  </main>
  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbwgDNaAGWFc6h04VNf6f5Uk5-I3UONGkcInSgKM30dNL-Xmc3tjnpYzAJbTfZz7svbamg/exec";
    const statusEl = document.getElementById('status');
    // Explicit fallback button remains available if automatic navigation is blocked.
    window.setTimeout(() => {
      statusEl.textContent = 'Menghubungkan ke aplikasi utama…';
      window.location.replace(APP_URL);
    }, 1400);
  </script>
</body>
</html>
